# Workflow: Clippy PR check (blocking on changed files).
#
# Runs Clippy on every pull_request, push to main, and merge_group.
# - Fails if Clippy errors are found in Rust files changed by the PR.
# - The same changed-files scope is applied for both pull_request and
#   merge_group (gate) so that a passing PR check guarantees a passing gate.
# - Writes a job summary with error/warning counts and the first 20 error lines.
# - Uploads full findings + errors-only file as a downloadable artifact.
#
# Cache is saved only on pushes to main (not on PRs) to avoid
# cache poisoning from unreviewed code.

name: Clippy Check

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the clippy findings artifact"
        value: ${{ jobs.clippy.outputs.artifact-name }}
      errors:
        description: "Total clippy error count"
        value: ${{ jobs.clippy.outputs.errors }}
      warnings:
        description: "Total clippy warning count"
        value: ${{ jobs.clippy.outputs.warnings }}
      conclusion:
        description: "Job conclusion: success or failure"
        value: ${{ jobs.clippy.outputs.conclusion }}

permissions:
  contents: read

concurrency:
  group: clippy-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  ANDROID_HOME: ""
  ANDROID_SDK_ROOT: ""
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  clippy:
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: clippy-findings
      errors: ${{ steps.findings.outputs.errors }}
      warnings: ${{ steps.findings.outputs.warnings }}
      conclusion: ${{ steps.set-conclusion.outputs.conclusion }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Free Disk Space (Ubuntu)
        uses: eclipse-score/more-disk-space@v1
        with:
          level: 4

      - uses: castler/setup-bazel@cache-optimized
        with:
          bazelisk-cache: true
          disk-cache: "clippy"
          repository-cache: true
          cache-optimized: true
          cache-save: ${{ github.ref == 'refs/heads/main' }}

      - name: Allow linux-sandbox
        uses: ./actions/unblock_user_namespace_for_linux_sandbox

      - name: Run Clippy via Bazel
        id: run-clippy
        # continue-on-error so we can collect findings and upload the artifact
        # even when the Bazel invocation exits non-zero.
        continue-on-error: true
        run: |
          bazel test --config=lint //score/mw/com/... \
            2>&1 | tee clippy_raw.log

      - name: Collect findings
        id: findings
        run: |
          # Extract clippy errors and warnings from the log
          ERRORS=$(grep -c "error:" clippy_raw.log 2>/dev/null || true)
          WARNINGS=$(grep -c "warning:" clippy_raw.log 2>/dev/null || true)
          TOTAL=$((ERRORS + WARNINGS))

          # Scope blocking errors to Rust files changed in this PR / merge-group
          # commit set. The same logic is applied for all event types
          # (pull_request, merge_group, push to main) so that a check passing on
          # a PR is guaranteed to also pass at gate — no late-feedback surprises.
          #
          # GITHUB_BASE_REF is set by GitHub for both pull_request and
          # merge_group events (it is the name of the target branch, e.g. main).
          CHANGED_RUST=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null \
            | grep -E '\.rs$' || true)

          if [[ -z "$CHANGED_RUST" ]]; then
            ERRORS_BLOCKING=0
          else
            PATTERN=$(echo "$CHANGED_RUST" | tr '\n' '|' | sed 's/|$//')
            ERRORS_BLOCKING=$(grep -E "(${PATTERN})" clippy_raw.log 2>/dev/null \
              | grep -c "error:" || true)
          fi

          echo "errors=${ERRORS}"                   >> $GITHUB_OUTPUT
          echo "warnings=${WARNINGS}"               >> $GITHUB_OUTPUT
          echo "total=${TOTAL}"                     >> $GITHUB_OUTPUT
          echo "errors_blocking=${ERRORS_BLOCKING}" >> $GITHUB_OUTPUT

          # ── Write full findings and errors-only files for artifact ────────
          cp clippy_raw.log clippy_findings.txt 2>/dev/null || true

          # Keep the published report human-readable even when no findings
          # were produced in this run.
          if [[ ! -s clippy_findings.txt ]]; then
            {
              echo "No clippy findings were produced for this run."
              echo "errors=${ERRORS} warnings=${WARNINGS} total=${TOTAL}"
            } > clippy_findings.txt
          fi

          grep "error:" clippy_findings.txt > clippy_errors.txt || true

          # ── Job summary ──────────────────────────────────────────────────
          {
            echo "## Clippy Results"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|------:|"
            echo "| :x: Errors | **${ERRORS}** |"
            echo "| :warning: Warnings | **${WARNINGS}** |"
            echo "| Total | **${TOTAL}** |"
            if [[ "${ERRORS_BLOCKING}" -gt 0 ]]; then
              echo ""
              echo "> :x: **Check failed** — clippy errors found in changed files. Fix before merging."
              echo ""
              echo "### First 20 errors in changed files"
              echo '```'
              head -20 clippy_errors.txt || true
              echo '```'
            else
              echo ""
              echo "> :white_check_mark: **Check passed** — no clippy errors in changed files."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload clippy findings as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-findings
          path: |
            clippy_findings.txt
            clippy_errors.txt
            clippy_raw.log
          if-no-files-found: ignore
          retention-days: 7

      # Clippy findings are always collected and uploaded as an artifact,
      # but they should only block merging when a developer is actively
      # submitting code — not during nightly reporting runs.
      - name: Fail check if clippy errors found in changed files
        if: (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && steps.findings.outputs.errors_blocking != '0'
        run: |
          echo "::error::Clippy found ${{ steps.findings.outputs.errors_blocking }} error(s) in changed files. See the 'clippy-findings' artifact for details."
          echo ""
          echo "=== Clippy errors ==="
          cat clippy_errors.txt || true
          exit 1

      - name: Set conclusion
        id: set-conclusion
        if: always()
        run: |
          if [[ "${{ steps.run-clippy.outcome }}" == "success" ]]; then
            echo "conclusion=success" >> $GITHUB_OUTPUT
          else
            echo "conclusion=failure" >> $GITHUB_OUTPUT
          fi
